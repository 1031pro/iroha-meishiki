<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="theme-color" content="#ed347a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>かんたん命式シート</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="input-screen" class="input-screen" aria-label="命式入力">
        <div class="brand-copy">
          <p class="brand-ribbon">四柱推命</p>
          <h1>かんたん命式シート</h1>
          <p>生年月日と生まれた時間から、命式を作りましょう</p>
        </div>

        <form id="birth-form" class="birth-form">
          <fieldset>
            <legend>あなたの生年月日</legend>
            <div class="date-grid">
              <label><span>年</span><select id="birth-year" required></select></label>
              <label><span>月</span><select id="birth-month" required></select></label>
              <label><span>日</span><select id="birth-day" required></select></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>あなたの出生時刻</legend>
            <div class="time-grid">
              <label><span>時</span><select id="birth-hour"></select></label>
              <label><span>分</span><select id="birth-minute"></select></label>
              <label class="unknown-row"><input id="unknown-time" type="checkbox" checked /><span>時刻不明</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>あなたの性別</legend>
            <div class="sex-switch">
              <label><input type="radio" name="sex" value="male" checked /><span>男性</span></label>
              <label><input type="radio" name="sex" value="female" /><span>女性</span></label>
            </div>
          </fieldset>
          <label class="base-year"><span>年運の基準年</span><input id="current-year" type="number" min="1900" max="2200" value="2026" /></label>
          <p id="form-error" class="form-error" role="alert" hidden></p>
          <button id="submit-button" type="submit">命式を表示</button>
        </form>
      </section>
      <section id="results" class="results-screen" aria-live="polite" hidden></section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
